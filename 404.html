<script>
/* Pohyb, presne ako na /nahlad/: prichody cez IntersectionObserver, nadpis po slovach,
   bocny register. Ziadna kniznica, ziadna slucka, prefers-reduced-motion vypina vsetko. */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hero = document.getElementById('hero');
  if (reduce) {
    document.querySelectorAll('.r, section').forEach(function (e) { e.classList.add('in'); });
  }
  if (!reduce && hero) {
    requestAnimationFrame(function () {
      hero.querySelectorAll('.r').forEach(function (e) { e.classList.add('in'); });
    });
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -12% 0px', threshold: 0.1 });
  document.querySelectorAll('section').forEach(function (s) { io.observe(s); });

  // nadpis sa objavi po slovach; riadok s vlastnou znackou prichadza vcelku
  var h1 = document.getElementById('h1');
  if (h1) {
    var i = 0;
    Array.prototype.forEach.call(h1.querySelectorAll('.l'), function (line) {
      if (line.children.length) {
        var sp = document.createElement('span');
        sp.className = 'w';
        sp.style.transitionDelay = (i++ * 0.06).toFixed(2) + 's';
        while (line.firstChild) sp.appendChild(line.firstChild);
        line.appendChild(sp);
        return;
      }
      line.innerHTML = line.textContent.split(' ').map(function (w) {
        var d = (i++ * 0.06).toFixed(2);
        return '<span class="w" style="transition-delay:' + d + 's">' + w + '</span>';
      }).join(' ');
    });
    requestAnimationFrame(function () { h1.classList.add('in'); });
  }

  // bocny register vie, ktora sekcia je v strede obrazovky
  var rail = document.querySelector('.rail');
  if (rail) {
    var links = Array.prototype.slice.call(rail.querySelectorAll('a'));
    var targets = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
    var railIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var i = targets.indexOf(en.target);
        if (i < 0 || !en.isIntersecting) return;
        links.forEach(function (a, j) { a.setAttribute('aria-current', j === i ? 'true' : 'false'); });
      });
      rail.classList.add('on');
    }, { rootMargin: '-45% 0px -45% 0px' });
    targets.forEach(function (t) { if (t) railIo.observe(t); });
  }
})();
</script>
