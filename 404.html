<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found: Supabase Redirect Doctor</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="./favicon.ico" />
<!-- No external font CDN: system font stack only (see body { font-family } below). -->
<style>
  :root {
    --paper:#f6f2ea; --paper-2:#fbf9f4; --ink:#1b1a17; --ink-2:#4a4741; --muted:#66625a; --line:#d9d2c4;
    --accent:#b23a1d;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#151412; --paper-2:#1d1b18; --ink:#efe9de; --ink-2:#c9c2b5; --muted:#8f887b; --line:#2e2b26; --accent:#e0623f; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  html { background:var(--paper); }
  body {
    color:var(--ink); background:var(--paper); font:16px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  a { color:inherit; text-decoration-color:var(--line); text-underline-offset:3px; }
  a:hover { text-decoration-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .mono { font-family:var(--mono); }
  .card { max-width:480px; width:100%; text-align:center; }
  .kicker { font:400 14px/1 var(--serif); color:var(--accent); letter-spacing:.06em; text-transform:uppercase; margin:0 0 14px; }
  h1 { font:400 clamp(28px,6vw,40px)/1.15 var(--serif); letter-spacing:-.01em; margin:0 0 14px; }
  p.sub { color:var(--ink-2); font-size:15.5px; margin:0 0 28px; overflow-wrap:anywhere; }
  .btn { display:inline-block; font:600 15px/1 var(--sans); padding:13px 20px; border-radius:4px; text-decoration:none; }
  .btn-solid { background:var(--accent); color:#fff; }
  .wordmark { display:block; font:600 15px/1 var(--serif); color:var(--muted); text-decoration:none; margin-bottom:34px; }
  .wordmark:hover { color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <a class="wordmark" href="./">Supabase Redirect Doctor</a>
    <p class="kicker">404</p>
    <h1>This page doesn't exist.</h1>
    <p class="sub">The redirect you followed didn't match anything here either. Paste your Supabase Auth config on the tool page instead.</p>
    <a class="btn btn-solid" href="./">Back to Supabase Redirect Doctor</a>
  </div>
</body>
</html>
